  <title>Obrázky – Obzor</title>

<body class="search-site">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Obzor – hlavní stránka">
      <span class="brand-mark" aria-hidden="true">O</span><span>obzor</span>
    </a>
    <nav class="main-nav" aria-label="Hlavní navigace">
      <a href="index.html">Web</a>
      <a href="images.html" aria-current="page">Obrázky</a>

      <a href="https://petrkostka-idontknow.github.io/portfolio/" target="_blank" rel="noopener noreferrer">Portfolio</a>
    </nav>
  </header>

  <main class="search-subpage image-page">
    <section class="search-panel" aria-labelledby="page-title">
      <p class="hero-kicker"><span aria-hidden="true">▧</span> Obrazový průzkumník</p>
      <h1 id="page-title">Najdi svět <span>v obrazech.</span></h1>
      <p class="subpage-copy">Zadej téma a vydej se za vizuální inspirací.</p>
      <form class="obzor-search" action="https://www.google.com/search" method="get" role="search">
        <input type="hidden" name="tbm" value="isch">
        <label class="visually-hidden" for="image-query">Jaký obrázek hledáš?</label>
        <span class="obzor-search-icon" aria-hidden="true">⌕</span>
        <input id="image-query" type="search" name="q" placeholder="např. polární záře nad horami" required>
        <button type="submit" class="search-submit">Hledat obrázky <span aria-hidden="true">↗</span></button>
      </form>
      <p class="search-note">Obzor je vlastní rozhraní. Obrázky poskytuje Vyhledávání Google.</p>
    </section>
    <a class="back-home" href="index.html">← Zpět na hlavní hledání</a>
  </main>
